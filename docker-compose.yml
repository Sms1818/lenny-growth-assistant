services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: lenny_growth
      POSTGRES_USER: lenny
      POSTGRES_PASSWORD: lenny_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lenny -d lenny_growth"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
